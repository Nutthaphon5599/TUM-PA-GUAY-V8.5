<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tum Pa Guay V8 Reports</title><link rel="stylesheet" href="reports.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#062d20"></head><body>
<header><div class="brand"><img src="logo.png" alt=""><div><b>Tum Pa Guay V8</b><small>Sales Reports & Backup</small></div></div><nav><a href="pos.html">POS</a><a href="admin.html">Dashboard</a><a href="index.html">Website</a><span id="userEmail"></span><button id="logout" hidden>Logout</button></nav></header>
<main>
<section id="login" class="login"><h1>Login</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginStatus"></p></section>
<section id="app" hidden>
<div class="hero"><div><h1>ລາຍງານຍອດຂາຍ / Sales Reports</h1><p>ค้นหา ตรวจสอบ ส่งออก และสำรองประวัติการขาย</p></div><div class="actions"><button id="exportCsv">Export CSV</button><button id="backupJson">Backup JSON</button></div></div>
<div class="filters"><label>From<input id="dateFrom" type="date"></label><label>To<input id="dateTo" type="date"></label><label>Bill<input id="billSearch" placeholder="TPG-..."></label><label>ຕູບ / Table<input id="tableSearch" type="number" min="1" placeholder="44"></label><button id="todayBtn">Today</button><button id="monthBtn">This month</button><button id="loadBtn" class="primary">Load report</button></div>
<div class="cards"><article><span>ยอดขาย</span><strong id="sales">0</strong></article><article><span>จำนวนบิล</span><strong id="bills">0</strong></article><article><span>VAT</span><strong id="vat">0</strong></article><article><span>ส่วนลด</span><strong id="discount">0</strong></article><article><span>เฉลี่ย/บิล</span><strong id="average">0</strong></article></div>
<div class="grid"><section class="panel"><h2>Payment methods</h2><div id="payments"></div></section><section class="panel"><h2>Top menu</h2><div id="topMenu"></div></section></div>
<section class="panel"><div class="panel-head"><h2>ประวัติบิล</h2><span id="resultInfo"></span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Bill</th><th>ຕູບ</th><th>Subtotal</th><th>Discount</th><th>VAT</th><th>Total</th><th>Payment</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth-stability.js"></script><script src="reports.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(console.error))}</script></body></html>
