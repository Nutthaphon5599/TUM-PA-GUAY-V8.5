<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tum Pa Guay Connection Test</title>
<style>
body{font-family:system-ui;margin:0;background:#f4efe5;color:#173e2a}.box{max-width:760px;margin:50px auto;background:#fff;padding:28px;border-radius:18px}
.ok{color:#16823c}.bad{color:#b22b2b}pre{white-space:pre-wrap;background:#f1f5f1;padding:15px;border-radius:10px}
</style>
</head>
<body><main class="box"><h1>Supabase Connection Test</h1><div id="status">กำลังตรวจสอบ...</div><pre id="details"></pre><a href="index.html">← กลับเว็บไซต์</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async()=>{
 const status=document.querySelector("#status"),details=document.querySelector("#details");
 try{
  const c=supabase.createClient(TPG_CONFIG.SUPABASE_URL,TPG_CONFIG.SUPABASE_ANON_KEY);
  const {data,error,count}=await c.from("menu_items").select("id,name_lo",{count:"exact"}).limit(3);
  if(error) throw error;
  status.className="ok";status.textContent="✅ เชื่อมต่อสำเร็จ";
  details.textContent=`พบเมนูทั้งหมด ${count} รายการ\nตัวอย่าง:\n${JSON.stringify(data,null,2)}`;
 }catch(e){
  status.className="bad";status.textContent="❌ เชื่อมต่อไม่สำเร็จ";
  details.textContent=e.message+"\n\nตรวจ config.js และ RLS policies";
 }
})();
</script></body></html>
